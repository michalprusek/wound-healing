# v3 with paper-recipe (256², bs=32, Focal, no SWA/TTA) for fair architecture ablation.
# Keeps the EfficientNet-B5 encoder.

data_root: ./data/data/raw/dataset
out_dir: ./data/runs/placeholder
arch: unetplusplus
encoder: efficientnet-b5
image_size: 256
batch_size: 32
epochs: 150
lr: 1.0e-4
loss: focal
val_ratio: 0.10
num_workers: 6
seed: 42
patience: 15
precision: 16-mixed
swa: false
tta: false
accumulate_grad_batches: 1
aux_params: false
aux_weight: 0.0
